# NexusAI frontend: static SPA + same-origin reverse proxy to the Spring Boot API.
# Lives at /etc/nginx/conf.d/default.conf (http context), so `map` is allowed here.

# Use the caller's X-Request-Id when present, otherwise generate one (forwarded to Spring, then to Python).
map $http_x_request_id $nexus_request_id {
  default $http_x_request_id;
  ""      $request_id;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # Spring enforces MAX_UPLOAD_MB (20). The proxy limit must be higher, otherwise nginx answers 413 first
  # (nginx default is 1 MB, which would break every document upload).
  client_max_body_size 25m;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
  # NOTE: text/event-stream is deliberately NOT in gzip_types (compression would buffer the stream).

  include /etc/nginx/snippets/security-headers.conf;

  location = /index.html {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files $uri =404;
  }

  # Only fingerprinted assets (Vite emits name-<hash>.ext) are immutable. The regex is QUOTED because it contains {}.
  location ~* "[-.][A-Za-z0-9_-]{8,}\.(?:js|css|woff2?|ttf|otf|svg|png|jpg|jpeg|webp)$" {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }
  # Other static files may change without a hash.
  location ~* "\.(?:js|css|woff2?|ttf|otf|svg|png|jpg|jpeg|webp)$" {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=3600" always;
    try_files $uri =404;
  }

  # API + SSE. Heartbeats (": ping" every 15 s) keep the idle read timeout from firing during long approval waits.
  location /api/ {
    include /etc/nginx/snippets/security-headers.conf;
    client_max_body_size 25m;
    proxy_pass http://backend:8080/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $nexus_request_id;
    proxy_set_header Connection "";
    proxy_connect_timeout 10s;
    proxy_buffering off;          # required for SSE
    proxy_request_buffering off;  # stream uploads straight to Spring
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # Liveness only. Every other actuator endpoint (notably /actuator/prometheus) is internal: Prometheus scrapes backend:8080 directly.
  location = /actuator/health {
    proxy_pass http://backend:8080/actuator/health;
    proxy_http_version 1.1;
    proxy_buffering off;
  }
  location /actuator/ { return 404; }
  location = /metrics { return 404; }

  location / { try_files $uri $uri/ /index.html; }
}
