[project]
name = "nexusai-ai-service"
version = "0.1.0"
requires-python = ">=3.11"
description = "NexusAI internal AI service (FastAPI + LangGraph). Dependencies live in requirements.txt."

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 130
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501", "E701", "E702", "UP042"]   # B008: FastAPI Depends(); E70x: compact enum lines
