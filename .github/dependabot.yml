# Dependency updates are deliberately quiet until the build is green on main:
# monthly, minor/patch only (no major jumps, including base images), grouped into one PR per ecosystem.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: maven
    directory: /backend
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      maven-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: pip
    directory: /ai-service
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      pip-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: docker
    directory: /frontend
    schedule: { interval: monthly }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /backend
    schedule: { interval: monthly }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /ai-service
    schedule: { interval: monthly }
    ignore:
      # keep the python base image on the line the dependencies are tested with; move it on purpose, not through a bot PR
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /infra/fake-ai
    schedule: { interval: monthly }
    ignore:
      # keep the python base image on the line the dependencies are tested with; move it on purpose, not through a bot PR
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker-compose
    directory: /infra
    schedule: { interval: monthly }
    ignore:
      # postgres/pgvector, prometheus, grafana and ollama are infrastructure: patch updates only, bigger jumps are deliberate
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
