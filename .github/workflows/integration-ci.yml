name: integration-ci
on:
  pull_request:
    paths: ['frontend/**', 'backend/**', 'ai-service/**', 'infra/**', '.github/workflows/integration-ci.yml']
  push:
    paths: ['frontend/**', 'backend/**', 'ai-service/**', 'infra/**', '.github/workflows/integration-ci.yml']
permissions:
  contents: read
concurrency:
  group: integration-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Detect full stack
        id: detect
        run: |
          if [ -f frontend/package.json ] && [ -f backend/pom.xml ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "::warning::frontend and backend sources are not both present yet: compose smoke test skipped."; fi
      - name: Create ephemeral test environment
        if: steps.detect.outputs.present == 'true'
        run: |
          cp infra/.env.example infra/.env
          # CI only: no LLM key and no web search (the fake AI stub replaces the AI service)
          sed -i 's/^GEMINI_API_KEY=.*/GEMINI_API_KEY=/' infra/.env
          sed -i 's/^WEB_SEARCH_ENABLED=.*/WEB_SEARCH_ENABLED=false/' infra/.env
          sed -i 's/^ADMIN_PASSWORD=.*/ADMIN_PASSWORD=TestAdmin-Password-12345/' infra/.env
      - name: Start services and wait for health
        if: steps.detect.outputs.present == 'true'
        run: |
          C="docker compose -f infra/docker-compose.yml -f infra/docker-compose.fake-ai.yml --env-file infra/.env"
          if ! $C up --build --wait --wait-timeout 600; then
            echo "===== container status ====="; $C ps -a || true
            echo "===== backend: last 150 log lines ====="; $C logs --no-color --tail 150 backend || true
            echo "===== backend: health probe results ====="
            docker inspect --format '{{json .State.Health}}' "$($C ps -aq backend)" || true
            exit 1
          fi
      - name: Smoke test (fake AI mode)
        if: steps.detect.outputs.present == 'true'
        run: |
          if ! bash infra/scripts/smoke-test.sh --fake-ai; then
            C="docker compose -f infra/docker-compose.yml -f infra/docker-compose.fake-ai.yml --env-file infra/.env"
            echo "===== backend: last 120 log lines ====="; $C logs --no-color --tail 120 backend || true
            echo "===== ai-service (fake AI): last 40 log lines ====="; $C logs --no-color --tail 40 ai-service || true
            exit 1
          fi
      - name: Dump logs on failure
        if: failure()
        run: |
          C="docker compose -f infra/docker-compose.yml -f infra/docker-compose.fake-ai.yml --env-file infra/.env"
          echo "===== container status ====="; $C ps -a || true
          echo "===== backend: last 200 log lines ====="; $C logs --no-color --tail 200 backend || true
          echo "===== backend: health probe results ====="
          docker inspect --format '{{json .State.Health}}' "$($C ps -aq backend)" || true
          echo "===== all services ====="; $C logs --no-color
      - name: Stop and remove ephemeral volumes
        if: always() && steps.detect.outputs.present == 'true'
        run: docker compose -f infra/docker-compose.yml -f infra/docker-compose.fake-ai.yml --env-file infra/.env down -v --remove-orphans
