name: frontend-ci
on:
  pull_request:
    paths: ['frontend/**', '.github/workflows/frontend-ci.yml']
  push:
    paths: ['frontend/**', '.github/workflows/frontend-ci.yml']
permissions:
  contents: read
concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run: { working-directory: frontend }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Detect frontend project
        id: detect
        working-directory: .
        run: |
          if [ -f frontend/package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "::warning::frontend/package.json missing; skipping frontend checks."; fi
      - if: steps.detect.outputs.present == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - if: steps.detect.outputs.present == 'true'
        run: npm install --no-audit --no-fund
      - if: steps.detect.outputs.present == 'true'
        run: npm run lint
      - if: steps.detect.outputs.present == 'true'
        run: npm run typecheck
      - if: steps.detect.outputs.present == 'true'
        run: npm run test -- --run
      - if: steps.detect.outputs.present == 'true'
        run: npm run build
      - if: steps.detect.outputs.present == 'true'
        name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - if: steps.detect.outputs.present == 'true'
        run: npm run test:a11y
