name: security
on:
  pull_request:
  push:
    branches: [main, master]
  schedule:
    - cron: '41 5 * * 3'
permissions:
  actions: read
  contents: read
  security-events: write
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { fetch-depth: 0 }
      - name: Gitleaks (free for personal accounts; organisations need a GITLEAKS_LICENSE secret)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Dependency Review (needs the dependency graph, which is on for public repositories)
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
  languages:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      any: ${{ steps.m.outputs.any }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - id: m
        run: |
          langs=()
          [ -f frontend/package.json ] && langs+=("javascript-typescript")
          [ -f ai-service/requirements.txt ] || [ -f ai-service/pyproject.toml ] && langs+=("python")
          [ -f backend/pom.xml ] && langs+=("java-kotlin")
          if [ ${#langs[@]} -eq 0 ]; then echo "any=false" >> "$GITHUB_OUTPUT"; echo 'matrix={"language":[]}' >> "$GITHUB_OUTPUT"
          else echo "any=true" >> "$GITHUB_OUTPUT"; echo "matrix={\"language\":$(printf '%s\n' "${langs[@]}" | jq -R . | jq -sc .)}" >> "$GITHUB_OUTPUT"; fi
  codeql:
    # Only languages that exist in the repository are analysed. Private repositories need GitHub Advanced Security for code scanning.
    needs: languages
    if: needs.languages.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.languages.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d
        with:
          category: "/language:${{ matrix.language }}"
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Detect manifests
        id: d
        run: |
          [ -f frontend/package.json ] && echo "node=true" >> "$GITHUB_OUTPUT" || echo "node=false" >> "$GITHUB_OUTPUT"
          if [ -f ai-service/requirements.txt ]; then echo "py=req" >> "$GITHUB_OUTPUT"; elif [ -f ai-service/pyproject.toml ]; then echo "py=proj" >> "$GITHUB_OUTPUT"; else echo "py=none" >> "$GITHUB_OUTPUT"; fi
      - if: steps.d.outputs.node == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Production dependencies must have no HIGH/CRITICAL advisories (gate)
        if: steps.d.outputs.node == 'true'
        run: npm install --prefix frontend --no-audit --no-fund && npm audit --prefix frontend --omit=dev --audit-level=high
      - name: "Dev-tool dependencies (reported only, not a gate; they never ship in the image)"
        if: steps.d.outputs.node == 'true'
        continue-on-error: true   # reason: dev tooling advisories are triaged via Dependabot, they must not block releases
        run: npm audit --prefix frontend --audit-level=high
      - if: steps.d.outputs.py != 'none'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Python dependencies (pip-audit)
        if: steps.d.outputs.py != 'none'
        run: |
          python -m pip install --upgrade pip pip-audit
          if [ "${{ steps.d.outputs.py }}" = "req" ]; then pip-audit -r ai-service/requirements.txt; else pip-audit ai-service; fi
  container-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Detect full stack
        id: d
        run: |
          if [ -f frontend/package.json ] && [ -f backend/pom.xml ] && { [ -f ai-service/requirements.txt ] || [ -f ai-service/pyproject.toml ]; }; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - name: Build service images
        if: steps.d.outputs.present == 'true'
        run: |
          docker build -t nexusai-frontend:ci ./frontend
          docker build -t nexusai-backend:ci ./backend
          docker build -t nexusai-ai-service:ci ./ai-service
      - name: Scan images with Trivy (HIGH/CRITICAL with an available fix fail the job)
        if: steps.d.outputs.present == 'true'
        run: |
          # Scan all images before failing, so a single run shows every finding.
          status=0
          for image in nexusai-frontend:ci nexusai-backend:ci nexusai-ai-service:ci; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$HOME/.cache/trivy:/root/.cache/" aquasec/trivy:0.67.2 image --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL "$image" || status=1
          done
          exit $status
