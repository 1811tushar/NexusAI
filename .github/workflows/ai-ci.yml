name: ai-ci
on:
  pull_request:
    paths: ['ai-service/**', 'infra/postgres/**', '.github/workflows/ai-ci.yml']
  push:
    paths: ['ai-service/**', 'infra/postgres/**', '.github/workflows/ai-ci.yml']
permissions:
  contents: read
concurrency:
  group: ai-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: nexusai
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: ci-postgres-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nexus -d nexusai"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      # Same variable names as the contract (section 11). LLM_PROVIDER=fake is a TEST-ONLY scripted model (never real network calls).
      INTERNAL_API_KEY: ci-internal-key
      AI_DB_HOST: localhost
      AI_DB_NAME: nexusai
      AI_DB_RW_USER: ai_rw
      AI_DB_RW_PASSWORD: ci-ai-rw-password
      AI_DB_RO_USER: ai_readonly
      AI_DB_RO_PASSWORD: ci-ai-ro-password
      LLM_PROVIDER: fake
      GEMINI_API_KEY: ''
      WEB_SEARCH_ENABLED: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Detect AI project
        id: detect
        run: |
          if [ -f ai-service/requirements.txt ] || [ -f ai-service/pyproject.toml ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "::warning::ai-service manifest not found: skipping."; fi
      - if: steps.detect.outputs.present == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            ai-service/requirements*.txt
            ai-service/pyproject.toml
      - name: Bootstrap database roles and ai schema (same script Compose uses)
        if: steps.detect.outputs.present == 'true'
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGPASSWORD: ci-postgres-password
          POSTGRES_USER: nexus
          POSTGRES_DB: nexusai
        run: sh infra/postgres/init.sh
      - name: Install dependencies (CPU-only torch first)
        if: steps.detect.outputs.present == 'true'
        working-directory: ai-service
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install -e ".[dev]" || pip install .; fi
          pip install ruff pytest pytest-asyncio
      - if: steps.detect.outputs.present == 'true'
        run: ruff check .
        working-directory: ai-service
      - if: steps.detect.outputs.present == 'true'
        run: pytest -q
        working-directory: ai-service
