name: backend-ci
on:
  pull_request:
    paths: ['backend/**', '.github/workflows/backend-ci.yml']
  push:
    paths: ['backend/**', '.github/workflows/backend-ci.yml']
permissions:
  contents: read
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Detect backend project
        id: detect
        run: |
          if [ -f backend/pom.xml ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "::warning::backend/pom.xml not found: backend sources are not in the repository yet, skipping."; fi
      - if: steps.detect.outputs.present == 'true'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - if: steps.detect.outputs.present == 'true'
        name: Build and test (Testcontainers needs the runner's Docker)
        working-directory: backend
        run: mvn -B verify -DtrimStackTrace=false
      - if: failure() && steps.detect.outputs.present == 'true'
        name: Root cause digest (read this first)
        working-directory: backend
        run: |
          echo "===== most frequent root-cause lines across all failing tests ====="
          grep -rhE "^Caused by: |APPLICATION FAILED|Schema-validation|BeanCreationException|UnsatisfiedDependency|Error creating bean|BindException|Failed to bind" target/failsafe-reports target/surefire-reports 2>/dev/null | sed 's/^[[:space:]]*//' | cut -c1-300 | sort | uniq -c | sort -rn | head -15 || true
          echo "===== first error in full ====="
          f=$(grep -rlE "<error" target/failsafe-reports target/surefire-reports --include='TEST-*.xml' 2>/dev/null | head -1)
          if [ -n "$f" ]; then echo "report: $f"; sed -n '/<error/,/<\/error>/p' "$f" | cut -c1-300 | head -70; fi
