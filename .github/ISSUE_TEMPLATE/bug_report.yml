name: Bug report
description: Report a reproducible defect
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: checklist
    attributes:
      label: Related checklist/contract IDs
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs and environment
    validations:
      required: false
