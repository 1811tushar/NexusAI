spring:
  application:
    name: nexusai-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:nexusai}}
    username: ${POSTGRES_USER:nexus}
    password: ${POSTGRES_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_MB:20}MB
      max-request-size: ${MAX_REQUEST_MB:21}MB
  threads:
    virtual:
      enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: false

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: nexusai-backend

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
  swagger-ui:
    enabled: false

nexus:
  jwt:
    secret: ${JWT_SECRET:}
    access-minutes: ${JWT_ACCESS_MINUTES:15}
    refresh-days: ${JWT_REFRESH_DAYS:14}
  cookie-secure: ${COOKIE_SECURE:false}
  registration-open: ${REGISTRATION_OPEN:false}
  bcrypt-strength: ${BCRYPT_STRENGTH:12}
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  internal-api-key: ${INTERNAL_API_KEY:}
  ai:
    url: ${AI_SERVICE_URL:http://localhost:8000}
    connect-timeout-ms: 5000
    ingest-timeout-sec: 120
    default-timeout-sec: 30
  upload:
    dir: ${UPLOAD_DIR:./data/uploads}
    max-mb: ${MAX_UPLOAD_MB:20}
    max-docs-total: ${MAX_DOCS_TOTAL:500}
    ingest-concurrency: ${INGEST_CONCURRENCY:2}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  rate-limit:
    auth-per-min: ${RATE_LIMIT_AUTH_PER_MIN:10}
    upload-per-min: ${RATE_LIMIT_UPLOAD_PER_MIN:20}
    investigation-start-per-min: ${RATE_LIMIT_INVESTIGATION_START_PER_MIN:6}
  sweeper:
    interval-ms: 60000
    stuck-ingesting-minutes: 10
  docs-public: false
  runs:
    max-concurrent-per-user: ${MAX_CONCURRENT_RUNS_PER_USER:2}
    approval-ttl-days: ${APPROVAL_TTL_DAYS:7}
    default-max-loops: ${MAX_LOOPS:3}
    max-loops-limit: 5
    stream-idle-timeout-sec: ${RUN_STREAM_IDLE_TIMEOUT_SEC:300}
    expiry-job-interval-ms: 60000
    orphan-grace-sec: 300
    heartbeat-seconds: 15
